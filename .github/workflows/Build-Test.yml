name: Build Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clawhud-build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test ClawHUD
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build WPF Settings Release x64
        shell: pwsh
        run: dotnet build src/ClawHUD.Settings/ClawHUD.Settings.csproj --configuration Release

      - name: Test WPF Settings
        shell: pwsh
        run: dotnet test tests/ClawHUD.Settings.Tests/ClawHUD.Settings.Tests.csproj --configuration Release

      - name: Validate WPF Settings publish shape
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'wpf-publish-check'
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          dotnet publish src/ClawHUD.Settings/ClawHUD.Settings.csproj `
            --configuration Release --self-contained false --output $out
          $required = @(
            'ClawHUD.Settings.exe',
            'ClawHUD.Settings.dll',
            'ClawHUD.Settings.deps.json',
            'ClawHUD.Settings.runtimeconfig.json'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $out $file))) {
              throw "WPF publish is missing required file: $file"
            }
          }
          foreach ($file in @('coreclr.dll', 'clrjit.dll', 'hostfxr.dll', 'dotnet.exe')) {
            if (Test-Path (Join-Path $out $file)) {
              throw "WPF publish unexpectedly contains a private .NET runtime file: $file"
            }
          }

      - name: Configure Release x64
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A x64
          -T v145
          -DBUILD_TESTING=ON

      - name: Build Release x64
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Run CTest Release
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
