name: Build Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clawhud-build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test ClawHUD
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release x64
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A x64
          -T v145
          -DBUILD_TESTING=ON

      - name: Build Release x64
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Run CTest Release
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
